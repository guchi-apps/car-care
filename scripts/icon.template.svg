<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Car Care のアプリアイコン。ここが原本で、public/icons/*.svg と *.png は
    scripts/generate-icons.sh が書き出す（npm run generate:icons）。
    __RADIUS__ / __SCALE__ / __TX__ / __TY__ は生成時に置き換わる。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d72ea"/>
      <stop offset="0.55" stop-color="#2050c8"/>
      <stop offset="1" stop-color="#0f2f83"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c48b8"/>
      <stop offset="1" stop-color="#12327f"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="__RADIUS__" fill="url(#bg)"/>
  <rect width="512" height="512" rx="__RADIUS__" fill="url(#glow)"/>

  <g transform="translate(__TX__,__TY__) scale(__SCALE__)">
    <g transform="translate(0,-15)">
      <!-- タイヤ -->
      <rect x="126" y="360" width="70" height="30" rx="15" fill="#0d2666"/>
      <rect x="316" y="360" width="70" height="30" rx="15" fill="#0d2666"/>
      <!-- ルーフ -->
      <path d="M158 250 L184 176 C189 161 201 152 216 152 H296 C311 152 323 161 328 176 L354 250 Z" fill="#ffffff"/>
      <!-- ボディ -->
      <rect x="96" y="242" width="320" height="126" rx="42" fill="#ffffff"/>
      <!-- フロントガラス -->
      <path d="M184 246 L205 186 C208 178 214 174 222 174 H290 C298 174 304 178 307 186 L328 246 Z" fill="url(#glass)"/>
      <!-- ヘッドライト -->
      <rect x="124" y="278" width="76" height="30" rx="15" fill="url(#lamp)"/>
      <rect x="312" y="278" width="76" height="30" rx="15" fill="url(#lamp)"/>
      <!-- グリル -->
      <rect x="214" y="330" width="84" height="18" rx="9" fill="#12327f" fill-opacity="0.32"/>
    </g>
  </g>
</svg>
