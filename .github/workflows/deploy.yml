name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-car-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  build:
    runs-on: ubuntu-latest
    needs: tag

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（car-care#60）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_WEBHOOK_LOGIN_URL: ${{ secrets.SIGNALY_WEBHOOK_LOGIN_URL }}
      ZAIM_CONSUMER_KEY: ${{ secrets.ZAIM_CONSUMER_KEY }}
      ZAIM_CONSUMER_SECRET: ${{ secrets.ZAIM_CONSUMER_SECRET }}
      ZAIM_TOKEN_ENCRYPTION_KEY: ${{ secrets.ZAIM_TOKEN_ENCRYPTION_KEY }}
      ZAIM_ALLOWED_EMAILS: ${{ secrets.ZAIM_ALLOWED_EMAILS }}
      AUTH_URL: ${{ vars.AUTH_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ci
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ env.DATABASE_URL }}
          # NEXT_PUBLIC_* はビルド時にクライアントバンドルへ埋め込まれるため、
          # deployジョブだけでなくここにも必要。
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create archive
        run: |
          tar -czf deploy.tar.gz \
            package.json \
            package-lock.json \
            public \
            .next \
            prisma \
            prisma.config.ts \
            src/lib/database-url.ts \
            deploy \
            scripts/install-apache-vhost.sh \
            scripts/update-env-file.sh \
            scripts/prod-db-ping.mjs \
            scripts/reconcile-migrations-deploy.mjs \
            scripts/migration-repairs.mjs \
            next.config.ts \
            ecosystem.config.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（car-care#60）。
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      HOST: ${{ secrets.SERVER_HOST }}
      USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      DB_HOST: ${{ secrets.SHARED_DB_HOST }}
      DB_PORT: ${{ secrets.SHARED_DB_PORT }}
      DB_USER: ${{ secrets.SHARED_DB_USER }}
      DB_PASSWORD: ${{ secrets.SHARED_DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      # マイグレーション専用ユーザー（DDL権限あり）。通常ユーザーには ALTER 権限が無く、
      # 列を追加するマイグレーションが `ALTER command denied` で落ちる（#91）。
      MIGRATE_DB_USER: ${{ secrets.SHARED_DB_MIGRATE_USER }}
      MIGRATE_DB_PASSWORD: ${{ secrets.SHARED_DB_MIGRATE_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_PROJECT_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      TARGET_DIR: ${{ secrets.TARGET_DIR }}
      ALLOWED_GOOGLE_EMAILS: ${{ secrets.ALLOWED_GOOGLE_EMAILS }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}
      SIGNALY_WEBHOOK_LOGIN_URL: ${{ secrets.SIGNALY_WEBHOOK_LOGIN_URL }}
      ZAIM_CONSUMER_KEY: ${{ secrets.ZAIM_CONSUMER_KEY }}
      ZAIM_CONSUMER_SECRET: ${{ secrets.ZAIM_CONSUMER_SECRET }}
      ZAIM_TOKEN_ENCRYPTION_KEY: ${{ secrets.ZAIM_TOKEN_ENCRYPTION_KEY }}
      ZAIM_ALLOWED_EMAILS: ${{ secrets.ZAIM_ALLOWED_EMAILS }}
      AUTH_URL: ${{ vars.AUTH_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./

      - name: Construct DATABASE_URL
        run: bash scripts/construct-database-url.sh

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ env.SSH_PRIVATE_KEY }}
          known_hosts: placeholder
          if_key_exists: replace

      - name: Add known hosts
        run: ssh-keyscan -p "${SSH_PORT}" -H "${HOST}" >> ~/.ssh/known_hosts

      - name: Upload archive
        run: |
          scp -P "${SSH_PORT}" deploy.tar.gz "${USERNAME}@${HOST}:${TARGET_DIR}/deploy.tar.gz"

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ env.MIGRATE_DATABASE_URL }}
          DB_USER: ${{ env.DB_USER }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          DB_HOST: ${{ env.DB_HOST }}
          DB_PORT: ${{ env.DB_PORT }}
          DB_NAME: ${{ env.DB_NAME }}
          MIGRATE_DB_USER: ${{ env.MIGRATE_DB_USER }}
          MIGRATE_DB_PASSWORD: ${{ env.MIGRATE_DB_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          ALLOWED_GOOGLE_EMAILS: ${{ env.ALLOWED_GOOGLE_EMAILS }}
          SIGNALY_WEBHOOK_LOGIN_URL: ${{ env.SIGNALY_WEBHOOK_LOGIN_URL }}
          ZAIM_CONSUMER_KEY: ${{ env.ZAIM_CONSUMER_KEY }}
          ZAIM_CONSUMER_SECRET: ${{ env.ZAIM_CONSUMER_SECRET }}
          ZAIM_TOKEN_ENCRYPTION_KEY: ${{ env.ZAIM_TOKEN_ENCRYPTION_KEY }}
          ZAIM_ALLOWED_EMAILS: ${{ env.ZAIM_ALLOWED_EMAILS }}
          TARGET_DIR: ${{ env.TARGET_DIR }}
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USERNAME }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: DATABASE_URL,MIGRATE_DATABASE_URL,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,DB_NAME,MIGRATE_DB_USER,MIGRATE_DB_PASSWORD,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,ALLOWED_GOOGLE_EMAILS,SIGNALY_WEBHOOK_LOGIN_URL,ZAIM_CONSUMER_KEY,ZAIM_CONSUMER_SECRET,ZAIM_TOKEN_ENCRYPTION_KEY,ZAIM_ALLOWED_EMAILS,TARGET_DIR
          script: |
            set -euo pipefail
            cd "${TARGET_DIR}"

            # 待受ポートはシークレットではなく設定値として平文で持つ
            # （guchi-apps/docs の standards/ports.md「ポート番号は 1Password で管理しない」。#76）。
            PORT=3104

            echo "Cleaning up old release files..."
            rm -rf .next public package.json package-lock.json prisma prisma.config.ts src/lib/database-url.ts deploy scripts/install-apache-vhost.sh next.config.ts ecosystem.config.js

            echo "Extracting archive..."
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            update_env() {
              bash scripts/update-env-file.sh .env "$1" "$2"
            }

            echo "Updating .env..."
            update_env NODE_ENV production
            update_env PORT "$PORT"
            update_env DATABASE_URL "$DATABASE_URL"
            update_env DB_USER "$DB_USER"
            update_env DB_PASSWORD "$DB_PASSWORD"
            update_env DB_HOST "$DB_HOST"
            update_env DB_PORT "$DB_PORT"
            update_env DB_NAME "$DB_NAME"
            update_env NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL"
            update_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            update_env ALLOWED_GOOGLE_EMAILS "$ALLOWED_GOOGLE_EMAILS"
            update_env SIGNALY_WEBHOOK_LOGIN_URL "$SIGNALY_WEBHOOK_LOGIN_URL"
            # Zaim連携（#26）。未設定のまま流しても .env が空になるだけで、画面には出ない。
            # 鍵をまだ発行していない段階でも set -u で落ちないよう :- を付ける。
            update_env ZAIM_CONSUMER_KEY "${ZAIM_CONSUMER_KEY:-}"
            update_env ZAIM_CONSUMER_SECRET "${ZAIM_CONSUMER_SECRET:-}"
            update_env ZAIM_TOKEN_ENCRYPTION_KEY "${ZAIM_TOKEN_ENCRYPTION_KEY:-}"
            update_env ZAIM_ALLOWED_EMAILS "${ZAIM_ALLOWED_EMAILS:-}"

            echo "Installing production dependencies..."
            npm install --omit=dev --no-audit --prefer-offline

            # スキーマ整合スクリプトも `ALTER TABLE` を実行しうるため、`migrate deploy` と同じく
            # マイグレーション専用ユーザーで動かす（#31。通常ユーザーには ALTER 権限が無い）。
            # dotenv は既存の環境変数を上書きしないので、ここで渡した値が .env より優先される。
            # 未設定の環境では従来どおり通常ユーザーへフォールバックする。
            echo "Reconciling schema drift before migrations..."
            DB_USER="${MIGRATE_DB_USER:-$DB_USER}" \
            DB_PASSWORD="${MIGRATE_DB_PASSWORD:-$DB_PASSWORD}" \
            DATABASE_URL="${MIGRATE_DATABASE_URL:-$DATABASE_URL}" \
              node scripts/reconcile-migrations-deploy.mjs

            echo "Applying database migrations..."
            DATABASE_URL="${MIGRATE_DATABASE_URL:-$DATABASE_URL}" npx prisma migrate deploy

            echo "Restarting PM2..."
            if command -v pm2 >/dev/null 2>&1; then
              pm2 delete car-app 2>/dev/null || true
              PORT="$PORT" pm2 start ecosystem.config.js --env production
              pm2 save
            else
              echo "pm2 is required on the server. Install: npm install -g pm2"
              exit 1
            fi

            echo "Health check..."
            sleep 5
            node scripts/prod-db-ping.mjs
            # Next.js は起動完了までに数秒かかる。1回だけの curl では起動を待ちきれず、
            # アプリが正常に立ち上がっていても deploy ジョブが失敗する。失敗すると後続の
            # release がスキップされ、タグはあるのに GitHub Release が作られない状態になる
            # （複数アプリを同時にデプロイした際に実際に発生した）。
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/login"; then
                echo "Deployment successful."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after 60s."
            pm2 describe car-app || true
            pm2 logs car-app --lines 50 --nostream || true
            exit 1

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（car-care#60）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。
        # guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: Car Care
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んでいたが、
    # サービスアカウントの日次レート制限を使い切ってフリート全体のデプロイが止まった
    # （guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（car-care#60）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を落とさない
        # （1Passwordのレート制限でリリースPRのCIが赤くなった実績がある。
        # guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: Car Care
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
